<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BrewPOS - Sign In with Google</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background: linear-gradient(135deg, #4c1d0f 0%, #7c2d12 50%, #b45309 100%);
            min-height: 100vh; display: flex; align-items: center; justify-content: center;
            color: #fff;
        }
        .login-card {
            background: #fff; color: #1c1917; border-radius: 20px; padding: 48px 40px;
            width: 100%; max-width: 400px; box-shadow: 0 20px 50px rgba(0,0,0,0.4);
            text-align: center;
        }
        .logo {
            width: 80px; height: 80px; background: linear-gradient(135deg, #92400e, #b45309);
            border-radius: 50%; margin: 0 auto 16px; display: flex; align-items: center;
            justify-content: center; font-size: 40px;
        }
        .brand { font-size: 32px; font-weight: 900; letter-spacing: -1px; color: #7c2d12; }
        .brand span { color: #b45309; }
        .subtitle { color: #78716c; margin: 6px 0 28px; font-size: 14px; }
        .btn {
            width: 100%; padding: 14px; border: none; border-radius: 10px;
            background: linear-gradient(135deg, #b45309, #92400e); color: #fff;
            font-size: 15px; font-weight: 600; cursor: pointer; transition: all 0.15s;
        }
        .btn:hover { opacity: .9; }
        .btn:disabled { opacity: 0.6; cursor: default; }
        .btn-google {
            width: 100%; padding: 14px; border: 1px solid #d6d3d1; border-radius: 10px;
            background: #fff; color: #1c1917; font-size: 15px; font-weight: 600;
            cursor: pointer; transition: all 0.15s; margin-top: 12px; display: flex;
            align-items: center; justify-content: center; gap: 10px;
        }
        .btn-google:hover { background: #f7f5f4; }
        .btn-google:disabled { opacity: 0.6; cursor: default; }
        .divider { display: flex; align-items: center; text-align: center; margin: 22px 0; color: #a8a29e; font-size: 12px; }
        .divider::before, .divider::after { content: ''; flex: 1; border-bottom: 1px solid #d6d3d1; }
        .divider span { padding: 0 10px; }
        #error { color: #dc2626; font-size: 13px; margin-top: 14px; min-height: 18px; }
        .note { font-size: 12px; color: #a8a29e; margin-top: 22px; line-height: 1.5; }
        .back-link { font-size: 13px; color: #b45309; text-decoration: none; font-weight: 600; display: inline-block; margin-top: 16px; }
        .back-link:hover { text-decoration: underline; }
        .loader { display: inline-block; width: 16px; height: 16px; border: 2px solid #d6d3d1; border-top-color: #b45309; border-radius: 50%; animation: spin 0.8s linear infinite; vertical-align: middle; margin-right: 6px; }
        @keyframes spin { to { transform: rotate(360deg); } }
        .btn.loading { pointer-events: none; opacity: 0.85; }
    </style>
</head>
<body>
    <div class="login-card">
        <div class="logo">☕</div>
        <div class="brand">BREW<span>POS</span></div>
        <div class="subtitle">Coffee Shop POS &amp; Inventory System</div>

        <div id="error"></div>

        <button class="btn-google" id="googleBtn" onclick="signInWithGoogle()">
            <svg height="20" width="20" viewBox="0 0 24 24">
                <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
                <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
                <path fill="#FBBC05" d="M5.84 14.09c-.22-.62-.35-1.3-.35-2.09s.13-1.47.35-2.09V7.07H2.18C1.43 9.99 1 12.76 1 15.36c0 2.6 1.06 4.93 2.84 6.59l3.66-2.77c-.6-.98-.96-2.19-.96-3.5z"/>
                <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.57 2.18 7.07h3.66c.87-2.6 3.3-4.53 6.16-4.53z"/>
            </svg>
            Continue with Google
        </button>

        <div class="divider"><span>Or</span></div>

        <a href="/login" class="back-link">← Back to sign in</a>

        <div class="note">
            Signing in with Google creates/links your BrewPOS account.<br>
            The first Google account to sign in becomes the store administrator.
        </div>
    </div>

    <!-- Firebase SDK (loaded from CDN) -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.0.0/firebase-app.js";
        import { getAuth, GoogleAuthProvider, signInWithPopup } from "https://www.gstatic.com/firebasejs/11.0.0/firebase-auth.js";

        let firebaseConfig = null;

        async function initFirebase() {
            try {
                const resp = await fetch('/api/auth/firebase-config');
                firebaseConfig = await resp.json();
                if (!firebaseConfig || !firebaseConfig.apiKey) {
                    document.getElementById('error').textContent =
                        'Google Sign-In is not configured on the server. Please contact the administrator.';
                    document.getElementById('googleBtn').disabled = true;
                    return;
                }
                initializeApp(firebaseConfig);
            } catch (e) {
                document.getElementById('error').textContent = 'Failed to load Google Sign-In config.';
                document.getElementById('googleBtn').disabled = true;
            }
        }

        async function signInWithGoogle() {
            const btn = document.getElementById('googleBtn');
            const err = document.getElementById('error');
            err.textContent = '';
            btn.disabled = true;
            btn.innerHTML = '<span class="loader"></span>Signing in with Google...';

            try {
                const auth = getAuth();
                const provider = new GoogleAuthProvider();
                provider.setCustomParameters({ prompt: 'select_account' });
                const result = await signInWithPopup(auth, provider);
                const idToken = await result.user.getIdToken();

                // Send ID token to backend to verify and create/find user
                const resp = await fetch('/api/auth/google_login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ id_token: idToken }),
                });
                const data = await resp.json();

                if (data.success) {
                    window.location.href = data.redirect;
                } else {
                    err.textContent = data.message || 'Google sign-in failed.';
                    btn.disabled = false;
                    btn.textContent = 'Continue with Google';
                }
            } catch (e) {
                err.textContent = e.message || 'Google sign-in failed.';
                btn.disabled = false;
                btn.textContent = 'Continue with Google';
            }
        }

        initFirebase();
    </script>
</body>
</html>
